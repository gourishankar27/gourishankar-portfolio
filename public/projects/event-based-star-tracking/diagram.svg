    <rect x="1020" y="250" width="120" height="110" rx="18" fill="#0F1A36" stroke="#A7F3D0" stroke-opacity="0.35"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" fill="#EAF2FF" font-size="17" font-weight="600">
