<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">Adaptive Digital Assistant: system architecture diagram</title><desc id="description">Local inference. Source-linked memory. Reviewed interaction. Solid arrows: request/data interfaces; model response returns through the API. Optional Android local speech is reviewed before Send. Native wake/device acceptance remains open.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#14233a"/></linearGradient>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#4da3ff" stroke-opacity=".08"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4da3ff"/></marker>
  <marker id="proposal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff6b6b"/></marker>
</defs>
<rect width="1600" height="900" rx="30" fill="url(#bg)"/><rect width="1600" height="900" rx="30" fill="url(#grid)"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="80" y="85" font-size="20" fill="#4da3ff" letter-spacing="2">PRIVATE PERSONAL AI · RELEASE CANDIDATE</text><text x="80" y="155" font-size="48" fill="#e7eaf0" font-weight="700">Adaptive Digital Assistant</text><text x="80" y="205" font-size="25" fill="#cbd5e1" >Local inference. Source-linked memory. Reviewed interaction.</text><path d="M520 330H580" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M1020 330H1080" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M1300 410V550" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M300 550V410" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M800 550V410" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M1080 630H1050V480H800V410" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="250" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="102" y="293" font-size="27" fill="#e7eaf0" font-weight="700">Android + admin clients</text><text x="102" y="336" font-size="20" fill="#cbd5e1" >Compose interaction / web monitoring</text><text x="102" y="369" font-size="20" fill="#cbd5e1" >HTTPS sessions; no direct DB access</text><rect x="580" y="250" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="602" y="293" font-size="27" fill="#e7eaf0" font-weight="700">Authenticated FastAPI</text><text x="602" y="336" font-size="20" fill="#cbd5e1" >Owner, scope, consent and request fences</text><text x="602" y="369" font-size="20" fill="#cbd5e1" >Reserve / publish durable receipts</text><rect x="1080" y="250" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="1102" y="293" font-size="27" fill="#e7eaf0" font-weight="700">Context + retrieval</text><text x="1102" y="336" font-size="20" fill="#cbd5e1" >Claims and selected document excerpts</text><text x="1102" y="369" font-size="20" fill="#cbd5e1" >Source spans, trust and bounded context</text><rect x="80" y="550" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="102" y="593" font-size="27" fill="#e7eaf0" font-weight="700">Android encrypted journal</text><text x="102" y="636" font-size="20" fill="#cbd5e1" >Keystore-backed exact pending operations</text><text x="102" y="669" font-size="20" fill="#cbd5e1" >Restore by read; explicit Send / retry</text><rect x="580" y="550" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="602" y="593" font-size="27" fill="#e7eaf0" font-weight="700">PostgreSQL persistence</text><text x="602" y="636" font-size="20" fill="#cbd5e1" >Sources, versions, requests and memory</text><text x="602" y="669" font-size="20" fill="#cbd5e1" >Replay, erasure and versioned recovery</text><rect x="1080" y="550" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="1102" y="593" font-size="27" fill="#e7eaf0" font-weight="700">Local Ollama inference</text><text x="1102" y="636" font-size="20" fill="#cbd5e1" >Server-side generation and streaming</text><text x="1102" y="669" font-size="20" fill="#cbd5e1" >Shared admission, timeout, cancellation</text><path d="M80 765H1520" stroke="#4da3ff" stroke-opacity=".3"/><text x="80" y="810" font-size="22" fill="#cbd5e1" >Solid arrows: request/data interfaces; model response returns through the API.</text><text x="80" y="848" font-size="22" fill="#cbd5e1" >Optional Android local speech is reviewed before Send. Native wake/device acceptance remains open.</text></g></svg>
