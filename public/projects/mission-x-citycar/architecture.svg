<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">Mission-X CityCar: system architecture diagram</title><desc id="description">Navigation, supervision and drive backends on common ROS topics. Dashed feedback: sensor/TF state into navigation. Autonomous following currently uses no lateral strafe. Hardware adapters are implemented. Physical autonomy and quantitative mapping quality require validation.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#14233a"/></linearGradient>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#4da3ff" stroke-opacity=".08"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4da3ff"/></marker>
  <marker id="proposal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff6b6b"/></marker>
</defs>
<rect width="1600" height="900" rx="30" fill="url(#bg)"/><rect width="1600" height="900" rx="30" fill="url(#grid)"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="80" y="85" font-size="20" fill="#4da3ff" letter-spacing="2">ROS 2 MOBILE ROBOTICS · SOURCE-VERIFIED INTERFACES</text><text x="80" y="155" font-size="48" fill="#e7eaf0" font-weight="700">Mission-X CityCar</text><text x="80" y="205" font-size="25" fill="#cbd5e1" >Navigation, supervision and drive backends on common ROS topics.</text><path d="M520 330H580" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M1020 330H1080" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M1300 410V550" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M1080 630H1020" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M580 630H520" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M300 550V480H800V410" fill="none" stroke="#4da3ff" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><rect x="80" y="250" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="102" y="293" font-size="27" fill="#e7eaf0" font-weight="700">GUI + mission goals</text><text x="102" y="336" font-size="20" fill="#cbd5e1" >React / rosbridge; named goal manager</text><text x="102" y="369" font-size="20" fill="#cbd5e1" >Mission pause, resume and cancel</text><rect x="580" y="250" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="602" y="293" font-size="27" fill="#e7eaf0" font-weight="700">Planner + path follower</text><text x="602" y="336" font-size="20" fill="#cbd5e1" >A* waypoint graph; TF pose feedback</text><text x="602" y="369" font-size="20" fill="#cbd5e1" >Corner handling, recovery and replan</text><rect x="1080" y="250" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="1102" y="293" font-size="27" fill="#e7eaf0" font-weight="700">Command mux + limiter</text><text x="1102" y="336" font-size="20" fill="#cbd5e1" >Manual / auto source selection</text><text x="1102" y="369" font-size="20" fill="#cbd5e1" >Fresh input, mode-stop, velocity limits</text><rect x="80" y="550" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="102" y="593" font-size="27" fill="#e7eaf0" font-weight="700">Sensors + state feedback</text><text x="102" y="636" font-size="20" fill="#cbd5e1" >Camera, LiDAR, IMU, range and TF</text><text x="102" y="669" font-size="20" fill="#cbd5e1" >ORB-SLAM3 relay: experimental</text><rect x="580" y="550" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="602" y="593" font-size="27" fill="#e7eaf0" font-weight="700">Base driver + backends</text><text x="602" y="636" font-size="20" fill="#cbd5e1" >Body Twist → four wheel speeds</text><text x="602" y="669" font-size="20" fill="#cbd5e1" >Gazebo plugin OR Pi GPIO/PWM driver</text><rect x="1080" y="550" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="1102" y="593" font-size="27" fill="#e7eaf0" font-weight="700">Robot-side supervision</text><text x="1102" y="636" font-size="20" fill="#cbd5e1" >Arm, E-stop and optional heartbeat</text><text x="1102" y="669" font-size="20" fill="#cbd5e1" >Ultrasonic gate with explicit policy</text><path d="M80 765H1520" stroke="#4da3ff" stroke-opacity=".3"/><text x="80" y="810" font-size="22" fill="#cbd5e1" >Dashed feedback: sensor/TF state into navigation. Autonomous following currently uses no lateral strafe.</text><text x="80" y="848" font-size="22" fill="#cbd5e1" >Hardware adapters are implemented. Physical autonomy and quantitative mapping quality require validation.</text></g></svg>
