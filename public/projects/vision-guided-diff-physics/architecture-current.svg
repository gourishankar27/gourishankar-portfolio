<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">Vision-Guided Manipulation: system architecture diagram</title><desc id="description">Perception, independent execution authority and contact experiments. Dashed red: bounded model proposals in selected experiments. Live per-object friction adaptation remains gated. Historical Isaac Sim: CNN → temporal Transformer → offline rollout losses; separate from this Gazebo stack.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#14233a"/></linearGradient>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#4da3ff" stroke-opacity=".08"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4da3ff"/></marker>
  <marker id="proposal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff6b6b"/></marker>
</defs>
<rect width="1600" height="900" rx="30" fill="url(#bg)"/><rect width="1600" height="900" rx="30" fill="url(#grid)"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="80" y="85" font-size="20" fill="#4da3ff" letter-spacing="2">SIMULATION RESEARCH · ROS 2 / GAZEBO / DIFFERENTIABLE MODELS</text><text x="80" y="155" font-size="48" fill="#e7eaf0" font-weight="700">Vision-Guided Manipulation</text><text x="80" y="205" font-size="25" fill="#cbd5e1" >Perception, independent execution authority and contact experiments.</text><path d="M520 330H580" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M1020 330H1080" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M1300 410V550" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M1080 630H1020" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M580 630H520" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M300 550V480H1300V410" fill="none" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#proposal)"/><rect x="80" y="250" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="102" y="293" font-size="27" fill="#e7eaf0" font-weight="700">RGB-D + acquisition TF</text><text x="102" y="336" font-size="20" fill="#cbd5e1" >Camera model, known-cube geometry</text><text x="102" y="369" font-size="20" fill="#cbd5e1" >Observation source / time / covariance</text><rect x="580" y="250" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="602" y="293" font-size="27" fill="#e7eaf0" font-weight="700">State + uncertainty</text><text x="602" y="336" font-size="20" fill="#cbd5e1" >CV estimator and validity diagnostics</text><text x="602" y="369" font-size="20" fill="#cbd5e1" >Conservative bounds; stale-data guards</text><rect x="1080" y="250" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="1102" y="293" font-size="27" fill="#e7eaf0" font-weight="700">C++ planning / authority</text><text x="1102" y="336" font-size="20" fill="#cbd5e1" >MoveIt checks; versioned prepare/commit</text><text x="1102" y="369" font-size="20" fill="#cbd5e1" >Independent collision and state guards</text><rect x="80" y="550" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="102" y="593" font-size="27" fill="#e7eaf0" font-weight="700">Independent Warp surrogate</text><text x="102" y="636" font-size="20" fill="#cbd5e1" >Release model + global friction fitting</text><text x="102" y="669" font-size="20" fill="#cbd5e1" >Offline gradients; opt-in Push5 proposals</text><rect x="580" y="550" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="602" y="593" font-size="24" fill="#e7eaf0" font-weight="700">Observation + experiment log</text><text x="602" y="636" font-size="20" fill="#cbd5e1" >Contact / release / object motion</text><text x="602" y="669" font-size="20" fill="#cbd5e1" >Native state labeled safety/evaluation</text><rect x="1080" y="550" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="1102" y="593" font-size="27" fill="#e7eaf0" font-weight="700">Gazebo + trajectory control</text><text x="1102" y="636" font-size="20" fill="#cbd5e1" >Simulated Panda / ros2_control / JTC</text><text x="1102" y="669" font-size="20" fill="#cbd5e1" >Measured joint feedback and contact</text><path d="M80 765H1520" stroke="#4da3ff" stroke-opacity=".3"/><text x="80" y="810" font-size="22" fill="#cbd5e1" >Dashed red: bounded model proposals in selected experiments. Live per-object friction adaptation remains gated.</text><text x="80" y="848" font-size="22" fill="#cbd5e1" >Historical Isaac Sim: CNN → temporal Transformer → offline rollout losses; separate from this Gazebo stack.</text></g></svg>
