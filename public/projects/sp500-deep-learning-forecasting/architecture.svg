<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Modified TFT architecture</title>
<desc id="desc">Architecture diagram for the S&amp;P 500 forecasting system.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#08111f"/>
    <stop offset="0.55" stop-color="#111827"/>
    <stop offset="1" stop-color="#0f766e"/>
  </linearGradient>
  <linearGradient id="hot" x1="0" x2="1">
    <stop offset="0" stop-color="#f59e0b"/>
    <stop offset="1" stop-color="#ef4444"/>
  </linearGradient>
  <linearGradient id="cool" x1="0" x2="1">
    <stop offset="0" stop-color="#38bdf8"/>
    <stop offset="1" stop-color="#22c55e"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
  </filter>
  <style>
    .title { font: 800 54px Inter, Arial, sans-serif; fill: #f8fafc; }
    .subtitle { font: 500 25px Inter, Arial, sans-serif; fill: #cbd5e1; }
    .label { font: 700 22px Inter, Arial, sans-serif; fill: #e2e8f0; }
    .small { font: 500 17px Inter, Arial, sans-serif; fill: #cbd5e1; }
    .tiny { font: 600 13px Inter, Arial, sans-serif; fill: #94a3b8; }
    .num { font: 800 36px Inter, Arial, sans-serif; fill: #ffffff; }
  </style>
</defs>
<rect width="1600" height="900" fill="#f8fafc"/>
<path d="M0 0h1600v160H0z" fill="#111827"/>
<text x="70" y="96" class="title">Modified Temporal Fusion Transformer</text>
<text x="72" y="140" class="subtitle">Mixed-frequency market data, regime gates, and diagnostics</text>
<g font-family="Inter, Arial, sans-serif" font-weight="700" font-size="22" text-anchor="middle">
  <rect x="90" y="255" width="280" height="95" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text x="230" y="294" fill="#0f172a">Input Features</text><text x="230" y="326" fill="#475569" font-size="17">SPX, VIX, yields, CPI</text>
  <rect x="465" y="255" width="280" height="95" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="605" y="294" fill="#0f172a">Vintage Alignment</text><text x="605" y="326" fill="#475569" font-size="17">ALFRED + lag handling</text>
  <rect x="840" y="255" width="280" height="95" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="980" y="294" fill="#0f172a">TFT Encoder</text><text x="980" y="326" fill="#475569" font-size="17">VSN + LSTM context</text>
  <rect x="1215" y="255" width="280" height="95" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="1355" y="294" fill="#0f172a">Regime Gates</text><text x="1355" y="326" fill="#475569" font-size="17">VIX-conditioned attention</text>
</g>
<g stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none">
  <path d="M370 303h95"/><path d="M745 303h95"/><path d="M1120 303h95"/>
  <path d="M230 350v90h565"/><path d="M1355 350v90H795"/>
</g>
<g transform="translate(610 440)">
  <rect width="370" height="105" rx="24" fill="#111827" stroke="#475569" stroke-width="3" filter="url(#shadow)"/>
  <text x="185" y="45" class="label" text-anchor="middle">Shared Hidden State</text>
  <text x="185" y="78" class="small" text-anchor="middle">representation learning + attention context</text>
</g>
<g font-family="Inter, Arial, sans-serif" font-weight="700" font-size="22" text-anchor="middle">
  <rect x="215" y="645" width="300" height="105" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="365" y="687" fill="#0f172a">Quantile Forecasts</text><text x="365" y="720" fill="#475569" font-size="17">0.02 ... 0.98 outputs</text>
  <rect x="650" y="645" width="300" height="105" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="800" y="687" fill="#0f172a">Classification Head</text><text x="800" y="720" fill="#475569" font-size="17">direction / VIX regime</text>
  <rect x="1085" y="645" width="300" height="105" rx="22" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>
  <text x="1235" y="687" fill="#0f172a">MoE Output Layer</text><text x="1235" y="720" fill="#475569" font-size="17">regime-specific experts</text>
</g>
<g stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none">
  <path d="M795 545v62"/><path d="M795 607H365v38"/><path d="M795 607v38"/><path d="M795 607h440v38"/>
</g>
<text x="70" y="830" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#111827">Evaluation:</text>
<text x="215" y="830" font-family="Inter, Arial, sans-serif" font-size="24" fill="#334155">quantile loss, directional accuracy, Sharpe, hit rate, RMSE, MAE, max drawdown, gradient flow, prediction diversity</text>
</svg>
