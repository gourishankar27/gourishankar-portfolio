</g>
<g transform="translate(1110 160)" font-family="Inter, Arial, sans-serif" fill="#333">
  <text x="0" y="0" font-size="52" font-weight="500">VSN Feature</text>
  <text x="0" y="62" font-size="52" font-weight="500">Weights</text>
  <text x="0" y="120" font-size="30"><tspan font-weight="800">Baseline (top):</tspan> Feature weights</text>
  <text x="0" y="158" font-size="30">shift gradually across periods</text>
  <text x="30" y="215" font-size="30">- Treasury_10Y dominates</text>
  <text x="75" y="253" font-size="30">2020-2021</text>
  <text x="30" y="307" font-size="30">- Yield_Spread rises in</text>
  <text x="75" y="345" font-size="30">2023-2025</text>
  <text x="0" y="450" font-size="30"><tspan font-weight="800">With Regime Attention</tspan></text>
  <text x="0" y="488" font-size="30"><tspan font-weight="800">(bottom):</tspan> More dramatic</text>
  <text x="0" y="526" font-size="30">regime-specific focusing</text>
  <text x="30" y="583" font-size="30">- VIX spikes to 0.74 in bear</text>
  <text x="75" y="621" font-size="30">market (vs. 0.31 baseline)</text>
  <text x="30" y="675" font-size="30">- Yield_Spread dominates</text>
  <text x="75" y="713" font-size="30">2024 bull market (0.54)</text>
  <text x="0" y="810" font-size="30"><tspan font-weight="800">Takeaway:</tspan> Regime gates make</text>
  <text x="0" y="848" font-size="30">the model more adaptive.</text>
