<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Variable selection weights</title>
<desc id="desc">Baseline and regime-aware variable-selection weights across periods.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#08111f"/>
    <stop offset="0.55" stop-color="#111827"/>
    <stop offset="1" stop-color="#0f766e"/>
  </linearGradient>
  <linearGradient id="hot" x1="0" x2="1">
    <stop offset="0" stop-color="#f59e0b"/>
    <stop offset="1" stop-color="#ef4444"/>
  </linearGradient>
  <linearGradient id="cool" x1="0" x2="1">
    <stop offset="0" stop-color="#38bdf8"/>
    <stop offset="1" stop-color="#22c55e"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
  </filter>
  <style>
    .title { font: 800 54px Inter, Arial, sans-serif; fill: #f8fafc; }
    .subtitle { font: 500 25px Inter, Arial, sans-serif; fill: #cbd5e1; }
    .label { font: 700 22px Inter, Arial, sans-serif; fill: #e2e8f0; }
    .small { font: 500 17px Inter, Arial, sans-serif; fill: #cbd5e1; }
    .tiny { font: 600 13px Inter, Arial, sans-serif; fill: #94a3b8; }
    .num { font: 800 36px Inter, Arial, sans-serif; fill: #ffffff; }
  </style>
</defs>
<rect width="1600" height="900" fill="#e8e3da"/>
<path d="M1065 0h535v92l-365 58z" fill="url(#hot)"/>
<g transform="translate(60 45)">
