  <text x="508" y="55" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#111827">Variable Selection Weights by Period</text>
  <g font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <text x="180" y="780" transform="rotate(-35 180 780)" fill="#111827">VIX</text>
    <text x="350" y="780" transform="rotate(-35 350 780)" fill="#111827">Treasury_10Y</text>
    <text x="520" y="780" transform="rotate(-35 520 780)" fill="#111827">Yield_Spread</text>
    <text x="690" y="780" transform="rotate(-35 690 780)" fill="#111827">Inflation_YoY</text>
    <text x="860" y="780" transform="rotate(-35 860 780)" fill="#111827">relative_time_idx</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="end" fill="#111827">
    <text x="70" y="100">2020</text><text x="70" y="160">2021</text><text x="70" y="220">2022</text><text x="70" y="280">2023</text><text x="70" y="340">2024</text><text x="70" y="400">2025</text>
    <text x="70" y="488">2020</text><text x="70" y="548">2021</text><text x="70" y="608">2022</text><text x="70" y="668">2023</text><text x="70" y="728">2024</text><text x="70" y="788">2025</text>
  </g>
