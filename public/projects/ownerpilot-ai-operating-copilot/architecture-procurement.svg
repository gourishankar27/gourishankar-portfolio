<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">OwnerPilot: system architecture diagram</title><desc id="description">From source documents to evidence-backed internal decisions. PostgreSQL stores versioned RFQs, catalogs, source receipts, research and immutable approved quotes. Source inspection ≠ verified research completion ≠ quote readiness. No orders, payments or external delivery.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#14233a"/></linearGradient>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#4da3ff" stroke-opacity=".08"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4da3ff"/></marker>
  <marker id="proposal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff6b6b"/></marker>
</defs>
<rect width="1600" height="900" rx="30" fill="url(#bg)"/><rect width="1600" height="900" rx="30" fill="url(#grid)"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="80" y="85" font-size="20" fill="#4da3ff" letter-spacing="2">BUSINESS + PROCUREMENT INTELLIGENCE · HUMAN REVIEW</text><text x="80" y="155" font-size="48" fill="#e7eaf0" font-weight="700">OwnerPilot</text><text x="80" y="205" font-size="25" fill="#cbd5e1" >From source documents to evidence-backed internal decisions.</text><path d="M520 330H580" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M1020 330H1080" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M1300 410V550" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M1080 630H1020" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M580 630H520" fill="none" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="250" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="102" y="293" font-size="27" fill="#e7eaf0" font-weight="700">RFQ upload / API admission</text><text x="102" y="336" font-size="20" fill="#cbd5e1" >Next.js session + signed workspace proxy</text><text x="102" y="369" font-size="20" fill="#cbd5e1" >PDF, CSV, XLSX and UTF-8 text</text><rect x="580" y="250" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="602" y="293" font-size="27" fill="#e7eaf0" font-weight="700">Parse / OCR / extraction</text><text x="602" y="336" font-size="20" fill="#cbd5e1" >Celery + Redis; Tesseract / local Ollama</text><text x="602" y="369" font-size="20" fill="#cbd5e1" >Schema and source-association checks</text><rect x="1080" y="250" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="1102" y="293" font-size="27" fill="#e7eaf0" font-weight="700">Human RFQ review</text><text x="1102" y="336" font-size="20" fill="#cbd5e1" >Correct fields and approve a revision</text><text x="1102" y="369" font-size="20" fill="#cbd5e1" >Approval is separate from parsing</text><rect x="80" y="550" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="102" y="593" font-size="24" fill="#e7eaf0" font-weight="700">Verified facts + internal quote</text><text x="102" y="636" font-size="20" fill="#cbd5e1" >Backend materialization / Decimal math</text><text x="102" y="669" font-size="20" fill="#cbd5e1" >Explicit human quote review / approval</text><rect x="580" y="550" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="602" y="593" font-size="24" fill="#e7eaf0" font-weight="700">Bounded procurement research</text><text x="602" y="636" font-size="20" fill="#cbd5e1" >Native Ollama tools + coverage planner</text><text x="602" y="669" font-size="20" fill="#cbd5e1" >Immutable receipts; origin attribution</text><rect x="1080" y="550" width="440" height="160" rx="18" fill="#121827" stroke="#4da3ff" stroke-opacity=".45"/><text x="1102" y="593" font-size="27" fill="#e7eaf0" font-weight="700">Catalog retrieval + review</text><text x="1102" y="636" font-size="20" fill="#cbd5e1" >BM25 / embeddings / pgvector / RRF</text><text x="1102" y="669" font-size="20" fill="#cbd5e1" >Specs, reviewed selection, attested offers</text><path d="M80 765H1520" stroke="#4da3ff" stroke-opacity=".3"/><text x="80" y="810" font-size="22" fill="#cbd5e1" >PostgreSQL stores versioned RFQs, catalogs, source receipts, research and immutable approved quotes.</text><text x="80" y="848" font-size="22" fill="#cbd5e1" >Source inspection ≠ verified research completion ≠ quote readiness. No orders, payments or external delivery.</text></g></svg>
